<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="Superstar Hockey – fast-paced mobile arcade hockey">
    <title>Superstar Hockey</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="game-canvas"></canvas>

    <!-- Start Menu Overlay -->
    <div id="start-menu">
        <div class="menu-content">
            <h1 class="game-title">SUPERSTAR<br>HOCKEY</h1>
            <button id="btn-play" class="menu-btn primary">PLAY MATCH</button>
            <button id="btn-settings" class="menu-btn secondary">SETTINGS</button>
        </div>
    </div>

    <!-- Team Selection Overlay -->
    <div id="team-selection" class="hidden">
        <h2>SELECT YOUR TEAM</h2>
        <div class="team-cards" id="team-cards">
            <!-- Rendered by JS -->
        </div>
        <button id="btn-start-match" class="menu-btn primary disabled">START</button>
    </div>

<div id="ui-layer" class="hidden">
    <!-- Scoreboard -->
    <div id="scoreboard">
        <!-- Home team -->
        <div class="team-panel team-red" id="team-home-panel">
            <div class="team-logo-badge red" id="home-badge">🦅</div>
            <div class="team-info">
                <span class="team-abbr" id="home-abbr">YOU</span>
                <span class="team-score" id="score-home">0</span>
                <div class="shots">
                    <span>SOG</span>
                    <span id="shots-home">0</span>
                </div>
            </div>
        </div>

        <!-- Center clock -->
        <div class="time-block">
            <span class="clock" id="clock">3:00</span>
            <span class="period" id="period">1ST</span>
        </div>

        <!-- Away team -->
        <div class="team-panel right team-blue" id="team-away-panel">
            <div class="team-logo-badge blue" id="away-badge">🐺</div>
            <div class="team-info">
                <span class="team-abbr" id="away-abbr">OPP</span>
                <span class="team-score" id="score-away">0</span>
                <div class="shots">
                    <span>SOG</span>
                    <span id="shots-away">0</span>
                </div>
            </div>
        </div>

        <!-- Pause button -->
        <div class="pause-btn" id="pause-btn">
            <div class="bar"></div>
            <div class="bar"></div>
        </div>
    </div>

    <!-- Goal / Gameover overlay -->
    <div id="goal-overlay" class="hidden">
        <div class="goal-banner">
            <div class="goal-text">GOAL!</div>
            <div class="goal-scorer" id="goal-scorer"></div>
        </div>
    </div>

    <!-- Period transition banner -->
    <div id="period-banner">
        <div class="pb-label">Period</div>
        <div class="pb-value" id="pb-value">2ND</div>
    </div>

    <!-- Action buttons (right side - Superstar Hockey style) -->
    <div id="action-buttons">
        <button class="action-btn" id="btn-shoot">SHOOT</button>
        <button class="action-btn" id="btn-pass">PASS</button>
        <button class="action-btn" id="btn-hit">HIT</button>
    </div>
</div>

<script type="module" src="main.js"></script>

<!-- Dev error reporter -->
<script>
window.onerror = function(msg, url, ln, col) {
    const d = document.createElement('div');
    d.style.cssText = 'position:fixed;z-index:9999;top:0;left:0;right:0;background:red;color:#fff;padding:14px;font:14px monospace;word-break:break-all';
    d.innerHTML = '<b>JS Error</b><br>' + msg + '<br>Line ' + ln + ' Col ' + col;
    document.body.appendChild(d);
};
window.addEventListener('unhandledrejection', function(e) {
    const d = document.createElement('div');
    d.style.cssText = 'position:fixed;z-index:9999;top:80px;left:0;right:0;background:#c0392b;color:#fff;padding:14px;font:14px monospace;word-break:break-all';
    d.innerHTML = '<b>Promise Error</b><br>' + String(e.reason);
    document.body.appendChild(d);
});
</script>
</body>
</html>
